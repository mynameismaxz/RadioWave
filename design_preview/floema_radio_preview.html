<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RadioWave Player UI Preview</title>
  <style>
    :root {
      --bg: #4c4739;
      --bg-deep: #211f1a;
      --panel: rgba(24, 24, 21, 0.74);
      --panel-strong: rgba(12, 12, 11, 0.88);
      --panel-soft: rgba(255, 255, 255, 0.055);
      --stroke: rgba(255, 255, 255, 0.12);
      --stroke-dark: rgba(0, 0, 0, 0.36);
      --text: #f6f4ef;
      --muted: rgba(246, 244, 239, 0.62);
      --faint: rgba(246, 244, 239, 0.38);
      --bar: rgba(255, 255, 255, 0.24);
      --active: #ffffff;
      --shadow: rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 38%, rgba(208, 187, 145, 0.16), transparent 0 24%, transparent 54%),
        linear-gradient(180deg, #514c3f 0%, var(--bg) 56%, #433d31 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(20px, 4vw, 66px) 10px 22px;
      gap: clamp(28px, 5vw, 50px);
    }

    .art-wrap {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .album-art {
      width: min(33vw, 630px);
      min-width: 360px;
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 35% 34%, rgba(227, 185, 135, 0.58), transparent 0 10%, transparent 23%),
        radial-gradient(circle at 77% 28%, rgba(179, 189, 169, 0.38), transparent 0 15%, transparent 35%),
        linear-gradient(115deg, #030608 0 36%, #101617 37% 53%, #35443e 54% 72%, #091012 73% 100%);
      box-shadow: 0 20px 64px rgba(0, 0, 0, 0.38);
    }

    .album-art::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.88), transparent 0 48%, rgba(255, 255, 255, 0.08) 49% 51%, transparent 52%),
        radial-gradient(ellipse at 37% 34%, rgba(246, 220, 184, 0.48), transparent 0 9%, transparent 28%),
        radial-gradient(ellipse at 32% 45%, rgba(0, 0, 0, 0.78), transparent 0 20%, transparent 32%);
      mix-blend-mode: screen;
      opacity: 0.74;
    }

    .album-art::after {
      content: "";
      position: absolute;
      left: 54%;
      top: 9%;
      width: 34%;
      height: 82%;
      transform: skewX(-8deg);
      background:
        linear-gradient(180deg, rgba(190, 205, 183, 0.36), rgba(83, 95, 87, 0.3) 50%, rgba(14, 18, 17, 0.92)),
        linear-gradient(90deg, rgba(255, 255, 255, 0.16), transparent 34%);
      border-left: 2px solid rgba(236, 231, 215, 0.56);
      filter: blur(0.1px);
    }

    .photo-detail {
      position: absolute;
      right: 13%;
      bottom: 14%;
      width: 22%;
      height: 22%;
      border: 2px solid rgba(180, 119, 67, 0.32);
      background: linear-gradient(135deg, rgba(93, 47, 20, 0.68), rgba(12, 12, 11, 0.86));
      box-shadow: inset 0 0 0 12px rgba(255, 255, 255, 0.035);
    }

    .player-shell {
      width: 100%;
      max-width: 1900px;
      margin: 0 auto;
      min-height: 110px;
      display: grid;
      grid-template-columns: minmax(290px, 0.9fr) minmax(420px, 1.1fr) minmax(320px, 0.9fr);
      align-items: center;
      gap: 28px;
      padding: 18px 26px 17px 28px;
      border: 1px solid var(--stroke);
      border-radius: 22px;
      background:
        linear-gradient(90deg, rgba(35, 33, 29, 0.96), rgba(28, 27, 25, 0.9) 42%, rgba(22, 22, 21, 0.94)),
        var(--panel);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.38),
        0 18px 48px var(--shadow);
      backdrop-filter: blur(22px);
    }

    .track {
      min-width: 0;
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    .cover {
      width: 66px;
      aspect-ratio: 1;
      border-radius: 4px;
      overflow: hidden;
      background:
        radial-gradient(circle at 40% 36%, rgba(213, 167, 111, 0.55), transparent 0 15%, transparent 28%),
        linear-gradient(135deg, #0c0f0f 0 45%, #26342f 46% 100%);
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 7px 4px 5px 36px;
      background: linear-gradient(180deg, rgba(175, 193, 177, 0.36), rgba(15, 16, 14, 0.8));
      border-left: 1px solid rgba(255, 255, 255, 0.45);
      transform: skewX(-8deg);
    }

    .track-title {
      min-width: 0;
    }

    .track-title strong,
    .track-title span {
      display: block;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-title strong {
      font-size: 15px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .track-title span {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .track-title small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .icon-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 1.85;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .controls {
      min-width: 0;
      display: grid;
      gap: 17px;
      justify-items: center;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 2.2vw, 34px);
    }

    .transport {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: transparent;
      color: rgba(246, 244, 239, 0.78);
      border-radius: 50%;
    }

    .transport.primary {
      width: 44px;
      height: 44px;
      color: var(--active);
    }

    .transport svg {
      width: 25px;
      height: 25px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .transport.secondary svg {
      fill: none;
    }

    .progress-row {
      width: 100%;
      display: grid;
      grid-template-columns: 45px minmax(160px, 1fr) 45px;
      align-items: center;
      gap: 16px;
      color: var(--faint);
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .progress {
      height: 4px;
      border-radius: 999px;
      background: var(--bar);
      overflow: hidden;
      position: relative;
    }

    .progress::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 54%;
      background: var(--active);
    }

    .right-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 26px;
      min-width: 0;
    }

    .right-actions .icon-button {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    .preview-button {
      min-width: 154px;
      min-height: 54px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.16), transparent 0 42%),
        linear-gradient(180deg, rgba(34, 36, 34, 0.98), rgba(7, 10, 10, 0.98));
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 -1px 0 rgba(0, 0, 0, 0.8),
        0 8px 24px rgba(0, 0, 0, 0.34);
      font-weight: 800;
      font-size: 15px;
    }

    .mobile-top {
      display: none;
    }

    @media (max-width: 1100px) {
      .stage {
        padding-top: 34px;
      }

      .album-art {
        width: min(72vw, 560px);
        min-width: 280px;
      }

      .player-shell {
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
      }

      .right-actions {
        justify-content: center;
      }
    }

    @media (max-width: 720px) {
      body {
        background:
          radial-gradient(circle at 48% 26%, rgba(208, 187, 145, 0.12), transparent 0 30%),
          linear-gradient(180deg, #171716 0%, #2f2b24 100%);
      }

      .stage {
        padding: 0 7px 10px;
        gap: 18px;
      }

      .mobile-top {
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        min-height: 104px;
        padding: 14px 12px;
        border: 1px solid var(--stroke);
        border-radius: 18px;
        background:
          linear-gradient(90deg, rgba(28, 26, 23, 0.96), rgba(12, 12, 12, 0.92)),
          var(--panel-strong);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(18px);
      }

      .mobile-top .cover {
        width: 58px;
      }

      .mobile-top .track-title strong {
        font-size: 14px;
      }

      .mobile-top .track-title span,
      .mobile-top .track-title small {
        font-size: 13px;
      }

      .mobile-actions {
        display: flex;
        gap: 6px;
      }

      .art-wrap {
        min-height: calc(100vh - 242px);
      }

      .album-art {
        width: min(78vw, 460px);
        min-width: 240px;
      }

      .player-shell {
        min-height: auto;
        padding: 16px 16px 18px;
        border-radius: 18px;
      }

      .player-shell .track {
        display: none;
      }

      .control-row {
        gap: 18px;
      }

      .progress-row {
        grid-template-columns: 40px minmax(100px, 1fr) 40px;
        gap: 10px;
      }

      .right-actions {
        gap: 16px;
      }

      .preview-button {
        min-width: 132px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="mobile-top" aria-label="Compact player">
      <div class="cover" aria-hidden="true"></div>
      <div class="track-title">
        <strong>JEZEBEL</strong>
        <span>GIVEON</span>
        <small>♬ R&amp;B Love: Best New R&amp;B</small>
      </div>
      <div class="mobile-actions">
        <button class="icon-button" aria-label="Favorite">
          <svg viewBox="0 0 24 24"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 0 1 7.1-7.1l.4.4.4-.4a5 5 0 0 1 7.1 7.1Z"/></svg>
        </button>
        <button class="icon-button" aria-label="More">
          <svg viewBox="0 0 24 24"><path d="M12 12h.01M19 12h.01M5 12h.01"/></svg>
        </button>
      </div>
    </section>

    <section class="art-wrap" aria-label="Album artwork">
      <div class="album-art">
        <span class="photo-detail" aria-hidden="true"></span>
      </div>
    </section>

    <footer class="player-shell" aria-label="Radio player">
      <section class="track">
        <div class="cover" aria-hidden="true"></div>
        <div class="track-title">
          <strong>JEZEBEL</strong>
          <span>GIVEON</span>
          <small>♬ R&amp;B Love: Best New R&amp;B</small>
        </div>
        <div class="track-actions">
          <button class="icon-button" aria-label="Favorite">
            <svg viewBox="0 0 24 24"><path d="M19.5 12.6 12 20l-7.5-7.4a5 5 0 0 1 7.1-7.1l.4.4.4-.4a5 5 0 0 1 7.1 7.1Z"/></svg>
          </button>
          <button class="icon-button" aria-label="More">
            <svg viewBox="0 0 24 24"><path d="M12 12h.01M19 12h.01M5 12h.01"/></svg>
          </button>
        </div>
      </section>

      <section class="controls" aria-label="Playback controls">
        <div class="control-row">
          <button class="transport secondary" aria-label="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20l7.5-7.5M15 4l6 0 0 6M4 4l4 4M13 15l4 4M17 19h4v-4"/></svg>
          </button>
          <button class="transport" aria-label="Previous">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z"/></svg>
          </button>
          <button class="transport primary" aria-label="Pause">
            <svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>
          </button>
          <button class="transport" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>
          </button>
          <button class="transport secondary" aria-label="Repeat">
            <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
          </button>
        </div>
        <div class="progress-row">
          <span>0:22</span>
          <div class="progress" aria-hidden="true"></div>
          <span>0:29</span>
        </div>
      </section>

      <section class="right-actions" aria-label="Player actions">
        <button class="icon-button" aria-label="Queue">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h12M4 17h16"/></svg>
        </button>
        <button class="icon-button" aria-label="Volume">
          <svg viewBox="0 0 24 24"><path d="M4 10v4h4l6 5V5l-6 5H4ZM18 9a5 5 0 0 1 0 6"/></svg>
        </button>
        <button class="preview-button">Preview</button>
      </section>
    </footer>
  </main>
</body>
</html>
