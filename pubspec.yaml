name: radio_app_flutter
description: RadioWave is a cross-platform internet radio player for discovering, streaming, and saving live stations.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: any
  media_kit_libs_windows_audio: any
  shared_preferences: ^2.3.2
  flutter_volume_controller: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  icons_launcher: 3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png

icons_launcher:
  image_path: "assets/icons/app_icon.png"
  platforms:
    android:
      enable: true
      image_path: "assets/icons/app_icon.png"
      adaptive_background_color: "#F5081F"
      adaptive_foreground_image: "assets/icons/android_adaptive_foreground.png"
      adaptive_round_image: "assets/icons/android_adaptive_foreground.png"
    ios:
      enable: true
      image_path: "assets/icons/app_icon.png"
    web:
      enable: true
      image_path: "assets/icons/app_icon.png"
      maskable_image_path: "assets/icons/app_icon.png"
      favicon_path: "assets/icons/app_icon.png"
    windows:
      enable: true
      image_path: "assets/icons/app_icon.png"
